# Home Assistant add-on manifest for the Zählwerk App Space.
#
# This is a thin Ingress reverse-proxy: the actual Next.js app runs in a
# separate Proxmox LXC container; this add-on lets Home Assistant surface it as
# a native panel (iframe via Ingress) and forwards requests to `backend_url`.
name: "Zählwerk App Space"
slug: "zaehlwerk_space"
description: "Native Ingress Integration for Zählwerk App Space"
version: "1.0.1"
# Multi-arch: the base image (nginx:alpine) is available for both.
arch:
  - amd64
  - aarch64
# Ingress: HA proxies the panel to this add-on's port 80 under the HA origin,
# so no host port needs to be exposed and access is gated by HA auth.
ingress: true
ingress_port: 80
panel_icon: "mdi:gauge"
panel_title: "Zählwerk"
# The image is a plain nginx (no s6-overlay); let our own CMD be PID 1.
init: false
# Give the add-on outbound access on the local network to reach the LXC backend.
host_network: false
options:
  backend_url: "http://192.168.1.X:3000"
schema:
  # Base URL of the Next.js app in the LXC container (scheme + host + port,
  # no trailing slash), e.g. http://192.168.1.50:3000
  backend_url: "str"
