# Home Assistant add-on manifest for the Zählwerk App Space.
#
# Die eigentliche Next.js-App laeuft in einer eigenen Proxmox-LXC. Dieses Add-on
# ist ein duenner nginx-Reverse-Proxy davor — und seit 2.0.0 NUR das.
#
# Bis 1.1.0 hat es zusaetzlich die Content-Security-Policy der App neu geschrieben,
# mit einer Kopie der kompletten Policy in der nginx-Konfiguration und der Bitte,
# beide "in sync" zu halten. Das ist der Grund, aus dem RELEASE-3.0.0.md ~ 4 die
# Abschaffung des Add-ons vorschlug: zwei Orte fuer dieselbe Sicherheitsregel, und
# der Proxy merkt nicht, wenn die App ihre aendert — eine veraltete Policy ueber
# eine aktuelle gelegt schwaecht sie still.
#
# Jetzt entscheidet die App das beim Bauen (HA_INGRESS=true bzw. FRAME_ANCESTORS),
# und dieses Add-on leitet nur weiter. `frame_parent` ist deshalb entfallen.
#
# Two ways to use it:
#   • Ingress  — HA proxies same-origin; works for simple apps, but a Next.js app
#                with absolute asset/redirect paths 404s under the dynamic Ingress
#                sub-path. Available via the add-on's "Open Web UI"; no sidebar
#                panel is auto-created.
#   • Port + panel_iframe (recommended for this app) — the proxy is exposed on a
#     fixed port; point a Home Assistant `panel_iframe` at it. No sub-path issue.
name: "Zählwerk App Space"
slug: "zaehlwerk_space"
description: "Reverse proxy / Ingress bridge for the Zählwerk App Space"
version: "2.0.0"
arch:
  - amd64
  - aarch64
# Ingress stays available (Open Web UI) but no auto sidebar panel is created
# (panel_icon/panel_title omitted), since the reliable panel is panel_iframe.
ingress: true
ingress_port: 80
# Expose the proxy on a fixed host port for the panel_iframe route.
ports:
  "80/tcp": 8099
ports_description:
  "80/tcp": "HTTP reverse proxy to the App Space — use this in a HA panel_iframe"
# The image is a plain nginx (no s6-overlay); let our own CMD be PID 1.
init: false
host_network: false
options:
  backend_url: "http://192.168.1.X:3000"
schema:
  # Base URL of the Next.js app in the LXC container (scheme + host + port,
  # no trailing slash), e.g. http://192.168.1.50:3000
  backend_url: "str"
