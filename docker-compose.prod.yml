# Production compose file for a Proxmox LXC + Docker deployment.
# See DEPLOYMENT.md for the full setup walkthrough, including the security
# tradeoffs of the docker.sock + repo bind mounts used by the self-update
# feature below.

# Pin the Compose PROJECT name. Without this, the project defaults to the
# working directory's basename — which differs between a manual run from
# /opt/zaehlwerk (project "zaehlwerk") and the in-container self-update, whose
# cwd is the bind mount /repo (project "repo"). That mismatch made the update
# create a NEW empty volume (repo_zaehlwerk-db) and collide with the running
# container's name. Pinning it keeps networks/volumes/containers identical no
# matter where `docker compose` is invoked from.
name: zaehlwerk

services:
  main-portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the image as APP_GIT_SHA so the app reports the build it's
        # actually running. scripts/update.sh sets GIT_SHA before rebuilding;
        # for a manual build, prefix the command:
        #   GIT_SHA=$(git rev-parse HEAD) docker compose -f docker-compose.prod.yml up -d --build
        GIT_SHA: ${GIT_SHA:-unknown}
        # Einbettung in Home Assistant. BUILD-Argument, nicht Umgebungsvariable:
        # die Content-Security-Policy wird beim Bauen festgeschrieben, ein
        # Eintrag unter `environment:` käme zu spät und täte nichts.
        #
        # Leer = nicht einbettbar, und das ist der richtige Standard. Für eine
        # iframe-Karte die Origin von Home Assistant eintragen, mit Schema und
        # Port: FRAME_ANCESTORS="http://192.168.178.50:8123"
        FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
        HA_INGRESS: ${HA_INGRESS:-}
    image: zaehlwerk-main-portal:latest
    container_name: zaehlwerk-main-portal
    restart: unless-stopped
    ports:
      # Bind-Adresse als Variable, damit der riskante Teil der Absicherung eine
      # .env-Zeile ist und kein Datei-Edit: `APP_BIND=127.0.0.1` nimmt die App
      # aus dem LAN, ohne dass Caddy sie verliert (der geht über das Compose-Netz
      # an `main-portal:3000`, nicht über diesen Port). Default bleibt bewusst
      # offen — wer die Datei zieht, ohne Caddy zu betreiben, sperrt sich sonst
      # beim naechsten `up -d` selbst aus.
      #
      # Zurueckdrehen ist eine Zeile: APP_BIND entfernen, `up -d`.
      - "${APP_BIND:-0.0.0.0}:3000:3000"
    environment:
      NODE_ENV: production
      # Display timezone for everything the server renders (log timestamps, dates
      # in server-rendered pages). Without it a container defaults to UTC and a
      # German instance shows times two hours out, which reads as a broken clock.
      # It is PRESENTATION only: the system clock is one instant either way, and
      # TOTP/2FA works off Unix time and never sees a timezone at all.
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: file:/data/zaehlwerk.db
      # Required for /api/update/check — this repo is private, so an
      # unauthenticated GitHub API call to it 404s. Fine-grained PAT with
      # read-only "Contents" access to this repo is enough.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env}
      # Optional shared secret for POST /api/update/trigger. If set, the update
      # button requires it; if left empty, the update runs without a token
      # (the app now has login auth, so this is a second, optional gate).
      # Generate one with `openssl rand -hex 32` if you want the gate.
      UPDATE_TRIGGER_TOKEN: ${UPDATE_TRIGGER_TOKEN:-}
      # REQUIRED for Auth.js (login/sessions). Must be a STABLE random value —
      # changing it invalidates all sessions. Generate: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 32)}
      # Trust the host header behind the LXC / reverse proxy so Auth.js builds
      # correct callback URLs without a hardcoded AUTH_URL.
      AUTH_TRUST_HOST: "true"
      UPDATE_BRANCH: main
      # Where the live git checkout is bind-mounted inside the container —
      # both the version check (git rev-parse) and the update trigger
      # (git pull + docker compose) operate on this path.
      REPO_ROOT: /repo
      UPDATE_SCRIPT_PATH: /repo/scripts/update.sh
      COMPOSE_FILE: docker-compose.prod.yml
      # Automated log-ingestion watch-folder. CSVs dropped in this directory are
      # parsed, evaluated, stored and moved to <dir>/processed (or /failed). It
      # lives inside the persistent /data volume by default, so no extra mount is
      # needed. Set to an empty string to disable the watcher. For a Home
      # Assistant OS share, set LOG_WATCH_DIR=/share/log-analyzer and enable the
      # commented bind mount below.
      LOG_WATCH_DIR: ${LOG_WATCH_DIR:-/data/watch}
      # Optional bootstrap API key for POST /api/v1/logs/ingest, so a fresh HAOS
      # deployment can authenticate before any DB-managed key is minted in the
      # Settings UI. Generate with `openssl rand -hex 32`. Leave empty to require
      # a DB-managed key (X-API-Key header).
      INGESTION_API_KEY: ${INGESTION_API_KEY:-}
      # Emergency release for the instance-wide 2FA requirement. An admin who
      # turns that policy on WITHOUT a second factor of their own is gated out of
      # the settings page — including the switch that turns it off — and a lost
      # authenticator then locks the instance with no way in. Set this to 1 and
      # restart to suspend the policy (it is not cleared), sign in, sort it out,
      # then remove the variable again. Needing host access to use it is the
      # point.
      DISABLE_2FA_ENFORCEMENT: ${DISABLE_2FA_ENFORCEMENT:-}
      # Zugriffszahlen im Admin-Bereich. LAUFZEIT-Variablen, keine Build-Args:
      # sie werden bei jeder Abfrage gelesen, ein Wechsel des Tokens braucht also
      # keinen Rebuild — anders als FRAME_ANCESTORS, das in die ausgelieferte
      # Policy eingebacken wird.
      #
      # Sie MUESSEN hier stehen. Ein Eintrag allein in der .env erreicht den
      # Container nicht: compose liest die Datei nur, um ${...} zu ersetzen. Ohne
      # diese drei Zeilen meldet der Bereich "noch nicht eingerichtet", egal was
      # in der .env steht.
      #
      # Eigener Token mit `Analytics: Read` auf der Zone — der Tunnel-Token kann
      # nur Tunnel, und mehr als Lesen hat hier nichts zu suchen.
      CLOUDFLARE_ANALYTICS_TOKEN: ${CLOUDFLARE_ANALYTICS_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_ZONE_NAME: ${CLOUDFLARE_ZONE_NAME:-}
    volumes:
      # Persists the SQLite database across container recreations.
      - zaehlwerk-db:/data
      # Live repo checkout, so git pull / git rev-parse operate on real
      # history rather than a snapshot baked into the image.
      - .:/repo
      # Lets the update trigger run `docker compose up -d --build` against
      # the HOST's Docker daemon (docker-outside-of-docker). This grants the
      # container root-equivalent access to the host — see DEPLOYMENT.md
      # before exposing this service beyond a trusted network.
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: expose a Home Assistant OS / host shared folder to the
      # watch-folder importer, then set LOG_WATCH_DIR=/share/log-analyzer above.
      # The default LOG_WATCH_DIR (/data/watch) needs no extra mount — it already
      # lives inside the zaehlwerk-db volume.
      # - /srv/homeassistant/share/log-analyzer:/share/log-analyzer
    healthcheck:
      # Probe the cheap /api/health liveness endpoint (no DB, no network) via
      # node's global fetch — node is guaranteed present in the runtime image,
      # unlike curl, and this avoids flapping to "unhealthy" while the SSR
      # dashboard warms up. Exit 0 only on a 2xx response.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # One-shot helper that applies MIGRATIONS against the DB volume. Built from
  # the BUILDER stage (which has the Prisma CLI + schema, unlike the slim
  # runner). scripts/update.sh runs it via `docker compose run` so the build
  # goes through Compose's BuildKit — a plain `docker build` here uses the
  # legacy builder (no buildx plugin in the container) and chokes on the
  # Dockerfile's cache mounts. The "tools" profile keeps `up` from starting it.
  #
  # Frueher `prisma db push`: das glich die Datenbank dem Schema an, ohne
  # Historie und ohne zu sagen, was dabei verschwindet. `db:deploy` sichert
  # zuerst, stempelt bestehende Installationen auf die Baseline und spielt dann
  # nur die fehlenden Schritte ein (packages/database/scripts/deploy-migrations.sh).
  db-migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: zaehlwerk-migrator:latest
    environment:
      DATABASE_URL: file:/data/zaehlwerk.db
      # Damit ein `docker compose stop main-portal` von hier aus dasselbe
      # Projekt trifft wie ein Aufruf vom Host.
      # Der Container wird ueber seinen NAMEN angehalten, nicht ueber Compose.
      # Compose braeuchte die Projektdatei, und ein `- .:/repo` dafuer war genau
      # der Fehler: Bind-Mount-Quellen loest der HOST-Daemon auf, update.sh
      # laeuft aber IM Container mit cwd=/repo — der Daemon bekam einen Pfad,
      # den es auf dem Host nicht gibt, und ueberdeckte das Image-Verzeichnis
      # mit einem leeren. Ein Name hat dieses Problem nicht.
      APP_CONTAINER: ${APP_CONTAINER:-zaehlwerk-main-portal}
    volumes:
      - zaehlwerk-db:/data
      # Die Migration muss die Anwendung anhalten koennen, sonst laeuft sie
      # gegen deren offene Transaktionen — auch LESENDE blockieren Prismas
      # Schema-Engine, auch im WAL-Modus (gemessen, siehe docs/migrations.md).
      # Vier Updates sind daran gescheitert.
      #
      # Zur Tragweite: main-portal haelt diesen Socket bereits, dieser Dienst
      # wird aus derselben Quelle gebaut, laeuft im selben Projekt und wird
      # durch dieselbe Admin-Handlung gestartet. Keine neue Angriffsflaeche,
      # aber es ist und bleibt Root auf dem Host — siehe DEPLOYMENT.md.
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["sh", "-c", "cd packages/database && pnpm db:deploy"]

  # TLS-Terminierung. Erst hinter HTTPS laeuft das Session-Cookie nicht mehr im
  # Klartext durchs LAN — und `secure`-Cookies (2FA-Challenge) funktionieren
  # ueberhaupt. Siehe Caddyfile und DEPLOYMENT.md.
  caddy:
    image: caddy:2-alpine
    container_name: zaehlwerk-caddy
    restart: unless-stopped
    depends_on:
      - main-portal
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Der Name, unter dem die App im LAN erreichbar sein soll. Muss im Netz
      # aufloesen (Router-DNS-Eintrag oder hosts-Datei) — sonst kommt niemand an.
      ZW_HOSTNAME: ${ZW_HOSTNAME:?set ZW_HOSTNAME in .env, z.B. zaehlwerk.fritz.box}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ENTHAELT DIE LOKALE CA. Geht das Volume verloren, erzeugt Caddy eine neue
      # und jedes Geraet muss erneut vertrauen. Gehoert ins Backup.
      - caddy-data:/data
      - caddy-config:/config

  # Cloudflare Tunnel. Startet nur, wenn COMPOSE_PROFILES=tunnel in der .env
  # steht — ohne Token waere der Container sonst eine Dauerschleife aus
  # Neustarts auf jeder Instanz, die ihn nicht braucht.
  #
  # Zielt ueber das COMPOSE-NETZ auf `main-portal:3000`, nicht auf einen
  # veroeffentlichten Port: die Strecke verlaesst die Maschine nie, und
  # APP_BIND=127.0.0.1 kann bleiben. Ein Origin-Zertifikat braucht es damit
  # ebenfalls nicht — es gibt keine Netzstrecke, die zu schuetzen waere.
  #
  # --no-autoupdate ist Absicht: ein Dienst, der sich selbst im Hintergrund
  # ersetzt, aendert die Version unter dir, ohne dass es jemand ausgeloest hat.
  # Aktualisiert wird ueber das Image.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zaehlwerk-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - main-portal
    command: tunnel --no-autoupdate run
    environment:
      # Aus dem Zero-Trust-Dashboard beim Anlegen des Tunnels. Er ist ein
      # Geheimnis wie jedes andere und gehoert in die .env, nicht hierher.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}

volumes:
  zaehlwerk-db:
  caddy-data:
  caddy-config:
