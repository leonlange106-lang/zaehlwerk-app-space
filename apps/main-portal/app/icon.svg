<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App Space">
  <!--
    Favicon. Unlike the header mark this one needs its own tile — a browser tab
    is not our surface, so it supplies the accent gradient itself.
    Spokes are omitted for the same reason as in mark-appspace.svg: at 16px a
    2px line is sub-pixel. The satellites' placement carries the orbit.
  -->
  <defs>
    <linearGradient id="as-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#as-bg)"/>
  <rect x="24" y="24" width="16" height="16" rx="5" fill="#ffffff"/>
  <rect x="28" y="7" width="8" height="8" rx="2.6" fill="#ffffff" opacity="0.92"/>
  <rect x="49" y="28" width="8" height="8" rx="2.6" fill="#ffffff" opacity="0.72"/>
  <rect x="28" y="49" width="8" height="8" rx="2.6" fill="#ffffff" opacity="0.92"/>
  <rect x="7" y="28" width="8" height="8" rx="2.6" fill="#ffffff" opacity="0.72"/>
</svg>
