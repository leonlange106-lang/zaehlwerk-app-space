<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App Space">
  <!--
    Favicon. Unlike the header mark this one needs its own tile — a browser tab
    is not our surface, so it supplies the accent gradient itself.
    Filled panels for the same reason as in mark-appspace.svg: at 16px a
    hairline is sub-pixel and disappears. Offset plus opacity still read.

    The gradient is a hand-kept COPY of the dark --zw-accent/-2 pair: this file
    is its own document (favicon), so page CSS never reaches it and a token
    change here has to be made by hand. See the app-icon note in CLAUDE.md.
  -->
  <defs>
    <linearGradient id="as-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#as-bg)"/>
  <!-- Aurora-Ebenen, tile variant: the same three offset panels, scaled to sit
       inside a 64px plate with even optical margins. -->
  <rect x="21" y="12" width="30" height="21" rx="5" fill="#ffffff" opacity="0.34"/>
  <rect x="17" y="21" width="30" height="21" rx="5" fill="#ffffff" opacity="0.62"/>
  <rect x="13" y="30" width="30" height="21" rx="5" fill="#ffffff"/>
</svg>
