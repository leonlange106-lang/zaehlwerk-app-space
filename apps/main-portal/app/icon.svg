<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App Space">
  <defs>
    <linearGradient id="as-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#586a7e"/>
      <stop offset="1" stop-color="#3c4b5a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#as-bg)"/>
  <!-- hub-and-spoke: central hub linked to app satellites -->
  <g stroke="#c9d1d9" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="32" x2="18" y2="18"/>
    <line x1="32" y1="32" x2="46" y2="18"/>
    <line x1="32" y1="32" x2="18" y2="46"/>
    <line x1="32" y1="32" x2="46" y2="46"/>
  </g>
  <circle cx="18" cy="18" r="6" fill="#e5e9ed"/>
  <circle cx="46" cy="18" r="6" fill="#e5e9ed"/>
  <circle cx="18" cy="46" r="6" fill="#e5e9ed"/>
  <circle cx="46" cy="46" r="6" fill="#20c997"/>
  <circle cx="32" cy="32" r="8.5" fill="#ffffff"/>
</svg>
