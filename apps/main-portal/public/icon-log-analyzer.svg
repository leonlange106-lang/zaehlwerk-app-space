<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MGflasher Log Analyzer">
  <!--
    Log Analyzer: a datalog trace with its peak marked — one pull, and the point
    the evaluation cares about.

    Carries its own tile for the same reason as the Zählwerk mark, in that app's
    accent (amber → orange). The magnifier the old mark had is gone: at the 18px
    a menu row renders this, a 3px ring over a 2.6px trace is illegible mush.
    The peak dot survives that size and says the same thing.
  -->
  <defs>
    <linearGradient id="la-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#la-bg)"/>
  <!-- baseline the trace rides on -->
  <rect x="12" y="45" width="40" height="1.8" rx="0.9" fill="#2a1206" opacity="0.35"/>
  <!-- the pull -->
  <polyline points="12,44 19,43 25,34 31,37 38,20 45,27 52,25"
    fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- peak -->
  <circle cx="38" cy="20" r="4.6" fill="#ffffff"/>
  <circle cx="38" cy="20" r="2" fill="#f97316"/>
</svg>
