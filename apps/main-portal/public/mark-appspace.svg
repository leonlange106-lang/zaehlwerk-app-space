<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App Space">
  <defs>
    <linearGradient id="as-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f293d"/>
      <stop offset="1" stop-color="#080c14"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="6" fill="url(#as-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="5.25" fill="none" stroke="#374151" stroke-width="1.5"/>
  <!-- hub-and-spoke: central hub linked to app satellites -->
  <g stroke="#64748b" stroke-width="2.4" stroke-linecap="round">
    <line x1="32" y1="32" x2="18" y2="18"/>
    <line x1="32" y1="32" x2="46" y2="18"/>
    <line x1="32" y1="32" x2="18" y2="46"/>
    <line x1="32" y1="32" x2="46" y2="46"/>
  </g>
  <rect x="12" y="12" width="12" height="12" rx="2" fill="#e5e9f0"/>
  <rect x="40" y="12" width="12" height="12" rx="2" fill="#e5e9f0"/>
  <rect x="12" y="40" width="12" height="12" rx="2" fill="#e5e9f0"/>
  <rect x="40" y="40" width="12" height="12" rx="2" fill="#06b6d4"/>
  <rect x="24" y="24" width="16" height="16" rx="2" fill="#ffffff"/>
</svg>
