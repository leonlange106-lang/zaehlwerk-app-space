<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App Space">
  <!--
    App Space mark — "Aurora-Ebenen": three offset panels, the front one solid,
    the ones behind falling away in opacity.

    It speaks the SAME language as the product. The whole interface is
    translucent panels stacked over a deep deck, so the mark is the design
    system's own primitive rather than a symbol bolted on top of it — and the
    depth cue (offset + opacity) is exactly the one the panels themselves use.

    Deliberately a WHITE GLYPH ON TRANSPARENT rather than a self-contained tile.
    It is rendered inside the shell's accent-gradient chip, which supplies both
    the colour and the plate — and that accent re-points per app — so a mark
    carrying its own dark background would sit as a dark square inside a bright
    one, which is exactly how the old tile looked once the chip arrived.

    Referenced via <img src>, so `currentColor` is unavailable: an SVG loaded that
    way is its own document and never sees the page. White is right for every
    surface this mark actually appears on. The inlined wordmark in
    components/BrandLogo.tsx does use currentColor — see the note there.

    Built from FILLED shapes, never outlines. The header renders this at 19px,
    where a 1.5px stroke is sub-pixel and turns to mud — the same reason the
    previous mark had already dropped its connecting spokes. Offset and opacity
    survive any scale; a hairline does not.
  -->
  <!-- Back panel — furthest away, so the least present. -->
  <rect x="20" y="8" width="36" height="26" rx="6" fill="#ffffff" opacity="0.34"/>
  <!-- Middle panel. -->
  <rect x="14" y="19" width="36" height="26" rx="6" fill="#ffffff" opacity="0.62"/>
  <!-- Front panel — the one in focus, fully opaque. -->
  <rect x="8" y="30" width="36" height="26" rx="6" fill="#ffffff"/>
</svg>
