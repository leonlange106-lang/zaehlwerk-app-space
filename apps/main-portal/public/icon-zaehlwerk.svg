<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zählwerk">
  <!--
    Zählwerk: the digit wheels of a meter, the rightmost one lit — the place a
    reading actually changes.

    Unlike the App Space mark, this one DOES carry its own tile: it appears on
    the launcher and in menu rows, over surfaces of differing brightness and
    with no accent chip behind it. The gradient is the Zählwerk accent itself
    (cyan → blue), so the app is identifiable before its name is read.
  -->
  <defs>
    <linearGradient id="zw-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#zw-bg)"/>
  <!-- counter housing, punched out of the gradient -->
  <rect x="12" y="22" width="40" height="22" rx="6" fill="#0b1020" opacity="0.5"/>
  <!-- digit wheels, brightening towards the digit that turns -->
  <rect x="17" y="27" width="9" height="12" rx="2.5" fill="#ffffff" opacity="0.5"/>
  <rect x="27.5" y="27" width="9" height="12" rx="2.5" fill="#ffffff" opacity="0.75"/>
  <rect x="38" y="27" width="9" height="12" rx="2.5" fill="#ffffff"/>
  <!-- reading band across the wheels -->
  <rect x="12" y="32.2" width="40" height="1.6" rx="0.8" fill="#0b1020" opacity="0.4"/>
</svg>
